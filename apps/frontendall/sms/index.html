<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Brand palette — the portal's single source of truth for colour, served
         from the site root (apps/frontendall/brand.js). Blocking + first so the
         SPA's first paint is already branded. -->
    <script src="/brand.js?v=2"></script>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <title>SMS Workspace</title>
    <script type="module" crossorigin src="./assets/index-nIv0vDxR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DkhgM1Ne.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Mobile hard gate (on phones replaces the whole UI with a compulsory
         "install the app" screen). Shared vanilla file served at the site root. -->
    <script>
      (function () { var s = document.createElement("script"); s.src = "/app-gate.js?v=2"; s.defer = true; document.body.appendChild(s); })();
    </script>
    <!-- Announcement gate (blocking blurred popup for admin announcements). Shared
         vanilla file served at the site root; loaded at runtime so Vite never bundles it. -->
    <script>
      (function () { var s = document.createElement("script"); s.src = "/announcements.js?v=2"; s.defer = true; document.body.appendChild(s); })();
    </script>
  </body>
</html>
