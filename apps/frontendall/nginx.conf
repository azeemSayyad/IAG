map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html login.html;

  client_max_body_size 25m;

  # ^~ so the asset/html regex blocks below never hijack proxied API/socket paths.
  location ^~ /api/ {
    proxy_pass http://backend-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }

  location ^~ /socket.io/ {
    proxy_pass http://backend-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 3600s;
  }

  # React SPA: deep links under /sms/ fall back to the SPA shell (never login.html),
  # and the shell HTML must always revalidate so new build hashes are picked up.
  location /sms/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /sms/index.html;
  }

  # Hashed build assets — cache hard, but a MISSING hash 404s cleanly instead of
  # being silently replaced by login.html (which corrupts CSS/JS after a deploy).
  location ~* \.(?:js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico|map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # HTML pages must always revalidate so they reference current assets after deploys.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri /login.html;
  }

  location / {
    try_files $uri $uri/ /login.html;
  }
}
