# Staging ConfigMap (Step 25.1)
apiVersion: v1
kind: ConfigMap
metadata:
  name: launchpad-staging-config
  namespace: launchpad-staging
data:
  APP_ENV: "staging"
  APP_PORT: "8000"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3"
  REDIS_URL: "redis://redis:6379/0"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  QDRANT_URL: "http://qdrant:6333"
  FRONTEND_URL: "https://staging-app.launchpad.com"
  CORS_ORIGINS: "https://staging-app.launchpad.com"
