# Canary Deployment Strategy (Step 25.3)
# Gradual rollout using traffic splitting

# Stable Deployment (90% traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-stable
  namespace: launchpad
  labels:
    app: backend-api
    version: stable
    deployment-strategy: canary
spec:
  replicas: 9
  selector:
    matchLabels:
      app: backend-api
      version: stable
  template:
    metadata:
      labels:
        app: backend-api
        version: stable
    spec:
      containers:
        - name: backend-api
          image: launchpad/backend-api:v1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: launchpad-config
            - secretRef:
                name: launchpad-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Canary Deployment (10% traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-canary
  namespace: launchpad
  labels:
    app: backend-api
    version: canary
    deployment-strategy: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
      version: canary
  template:
    metadata:
      labels:
        app: backend-api
        version: canary
    spec:
      containers:
        - name: backend-api
          image: launchpad/backend-api:v1.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: launchpad-config
            - secretRef:
                name: launchpad-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Service with traffic splitting via Nginx Ingress
apiVersion: v1
kind: Service
metadata:
  name: backend-api-stable
  namespace: launchpad
spec:
  selector:
    app: backend-api
    version: stable
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-canary
  namespace: launchpad
spec:
  selector:
    app: backend-api
    version: canary
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
# Ingress with canary annotations
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-api-canary
  namespace: launchpad
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  rules:
    - host: api.launchpad.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-api-canary
                port:
                  number: 8000
