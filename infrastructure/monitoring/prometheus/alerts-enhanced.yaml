# Enhanced Alert Rules (Step 23.4)
# Comprehensive alerting for all system components

groups:
  - name: api_alerts
    rules:
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P95 latency is {{ $value }}s (threshold: 1s)"

      - alert: HighAPIErrorRate
        expr: rate(http_errors_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: APIEndpointDown
        expr: up{job="backend-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API endpoint is down"
          description: "Backend API is not responding"

  - name: ai_alerts
    rules:
      - alert: HighAILatency
        expr: histogram_quantile(0.95, rate(ai_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High AI latency detected"
          description: "P95 AI latency is {{ $value }}s (threshold: 5s)"

      - alert: AIServiceDown
        expr: up{job="ai-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI service is down"
          description: "AI service is not responding"

      - alert: HighAIErrorRate
        expr: rate(ai_requests_total{status="error"}[5m]) / rate(ai_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High AI error rate"
          description: "AI error rate is {{ $value | humanizePercentage }} (threshold: 10%)"

      - alert: AITokenUsageHigh
        expr: rate(ai_tokens_used_total[1h]) > 10000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "High AI token usage"
          description: "Token usage is {{ $value }}/hour (threshold: 10000)"

  - name: queue_alerts
    rules:
      - alert: HighQueueLag
        expr: queue_size > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High queue lag"
          description: "Queue {{ $labels.queue_name }} has {{ $value }} pending jobs"

      - alert: DeadLetterQueueGrowing
        expr: rate(queue_processed_total{status="dead_lettered"}[1h]) > 10
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue growing"
          description: "{{ $value }} jobs dead-lettered in the last hour"

      - alert: QueueProcessingStalled
        expr: rate(queue_processed_total[10m]) == 0 and queue_size > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Queue processing stalled"
          description: "Queue {{ $labels.queue_name }} has jobs but no processing"

  - name: database_alerts
    rules:
      - alert: HighDatabaseLatency
        expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database latency"
          description: "P95 query latency is {{ $value }}s (threshold: 0.5s)"

      - alert: DatabaseConnectionPoolHigh
        expr: db_connections_active > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool high"
          description: "{{ $value }} active connections (threshold: 80)"

      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database is down"
          description: "PostgreSQL is not responding"

  - name: redis_alerts
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis is not responding"

      - alert: HighRedisLatency
        expr: histogram_quantile(0.95, rate(redis_operation_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Redis latency"
          description: "P95 Redis latency is {{ $value }}s (threshold: 0.1s)"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 80%)"

  - name: infrastructure_alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% (threshold: 85%)"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low"
          description: "Disk space is {{ $value }}% free (threshold: 20%)"

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod crash looping"
          description: "Pod {{ $labels.pod }} is restarting frequently"

  - name: business_alerts
    rules:
      - alert: HighNoShowRate
        expr: rate(appointments_total{status="no_show"}[1d]) / rate(appointments_total[1d]) > 0.2
        for: 1d
        labels:
          severity: warning
        annotations:
          summary: "High no-show rate"
          description: "No-show rate is {{ $value | humanizePercentage }} (threshold: 20%)"

      - alert: LowBookingRate
        expr: rate(appointments_total{status="confirmed"}[1d]) / rate(leads_total[1d]) < 0.05
        for: 1d
        labels:
          severity: warning
        annotations:
          summary: "Low booking rate"
          description: "Booking rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: SMSDeliveryFailures
        expr: rate(sms_sent_total{status="failed"}[1h]) / rate(sms_sent_total[1h]) > 0.1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SMS delivery failures"
          description: "SMS failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"
